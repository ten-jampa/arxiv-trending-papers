[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "founder-radar"
version = "0.1.0"
description = "Founder-sourcing paper radar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
founder-radar = "founder_radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
